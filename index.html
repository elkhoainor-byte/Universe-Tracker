<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Universo Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #e50914;
      --text: #ffffff;
      --text-dim: #aaaaaa;
      --border: #333333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }
    
    header { background: #000; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; letter-spacing: 1px; color: var(--accent); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    
    nav { display: flex; justify-content: space-around; background: #1a1a1a; position: fixed; bottom: 0; width: 100%; border-top: 1px solid var(--border); z-index: 100; }
    nav button { background: none; border: none; color: var(--text-dim); padding: 12px 0; width: 100%; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    nav button.active { color: var(--accent); border-top: 2px solid var(--accent); }
    
    .tab-content { display: none; padding: 15px; }
    .tab-content.active { display: block; }

    form { background: var(--card-bg); padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    input, select, button.btn-add { padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #2a2a2a; color: #fff; font-size: 0.9rem; }
    button.btn-add { background: var(--accent); font-weight: bold; border: none; margin-top: 5px; cursor: pointer; }

    /* Filtros Avanzados mediante Desplegables */
    .filters-wrapper { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; background: var(--card-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
    .filter-header { font-size: 0.8rem; font-weight: bold; color: var(--text-dim); text-transform: uppercase; margin-bottom: 2px; }
    
    /* Indicador de Filtros Activos */
    .active-filters-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 0.8rem; padding-top: 4px; border-top: 1px dashed var(--border); margin-top: 4px; }
    .active-filters-label { font-weight: bold; color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; }
    .filter-badge { background: #333; color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.72rem; border: 1px solid var(--accent); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; transition: background 0.2s; }
    .filter-badge:hover { background: var(--accent); }
    .filter-badge .close-icon { font-weight: bold; margin-left: 2px; font-size: 0.8rem; }

    .card { background: var(--card-bg); padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .card-info { display: flex; flex-direction: column; gap: 6px; }
    .card-title { font-weight: bold; font-size: 1rem; }
    .card-sub { font-size: 0.8rem; color: var(--text-dim); }
    .tags-container { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.68rem; font-weight: bold; text-transform: uppercase; }
    
    /* Colores de Etiquetas */
    .tag-raw { background: #b20710; color: #fff; }
    .tag-smackdown { background: #0055b8; color: #fff; }
    .tag-nxt { background: #d4a017; color: #000; }
    .tag-evolve { background: #7b1fa2; color: #fff; }
    
    .tag-face { background: #2e7d32; color: #fff; }
    .tag-heel { background: #c62828; color: #fff; }

    .tag-gender { background: #37474f; color: #eceff1; }
    .tag-division { background: #455a64; color: #fff; }
    .tag-team { background: #ff9800; color: #000; font-weight: bold; }

    .btn-del { background: none; border: none; color: #888; font-size: 1.2rem; padding: 5px 10px; cursor: pointer; z-index: 2; }
    .btn-del:hover { color: var(--accent); }

    /* Selección múltiple para Tag Teams */
    .checkbox-list { max-height: 120px; overflow-y: auto; background: #2a2a2a; border: 1px solid var(--border); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }

    /* Modales */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; overflow-y: auto; padding: 20px 15px 80px 15px; }
    .modal-overlay.active { display: block; }
    .modal-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 15px; max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .modal-title { font-size: 1.1rem; font-weight: bold; color: var(--accent); }
    .modal-close { background: none; border: none; color: var(--text-dim); font-size: 1.5rem; cursor: pointer; }
    
    .stats-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .stat-card { background: #2a2a2a; padding: 8px; border-radius: 6px; border: 1px solid var(--border); }
    .stat-val { font-size: 1.1rem; font-weight: bold; }
    .stat-lbl { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; }
    
    .h2h-section { background: #252525; padding: 10px; border-radius: 6px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    .h2h-header { font-size: 0.85rem; font-weight: bold; color: var(--text-dim); }
    .match-item { background: #1a1a1a; padding: 8px; border-radius: 4px; font-size: 0.8rem; border-left: 3px solid var(--border); margin-bottom: 6px; }
    .match-item.win { border-left-color: #2e7d32; }
    .match-item.loss { border-left-color: #c62828; }
    .match-item.draw { border-left-color: #d4a017; }
  </style>
</head>
<body>

  <header>🎮 MODO UNIVERSO</header>

  <!-- TAB 1: ROSTER -->
  <div id="tab-roster" class="tab-content active">
    <form id="form-roster">
      <input type="text" id="roster-name" placeholder="Nombre del Superstar" required>
      <select id="roster-brand">
        <option value="RAW">RAW</option>
        <option value="SmackDown">SmackDown</option>
        <option value="NXT">NXT</option>
        <option value="EVOLVE">EVOLVE</option>
      </select>
      <select id="roster-alignment">
        <option value="Face">Face</option>
        <option value="Heel">Heel</option>
      </select>
      <select id="roster-gender">
        <option value="Men">Men</option>
        <option value="Women">Women</option>
      </select>
      <select id="roster-division">
        <option value="Main Eventer">Main Eventer</option>
        <option value="Midcarder">Midcarder</option>
        <option value="Tag Team">Tag Team</option>
        <option value="Jobber">Jobber</option>
      </select>
      <button type="submit" class="btn-add">Añadir a Roster</button>
    </form>

    <!-- Filtros por Pestañas Desplegables con Casillas de Selección -->
    <div class="filters-wrapper">
      <span class="filter-header">🔍 Seleccionar Filtros</span>
      <select id="filter-select-all" onchange="onFilterChange(this)">
        <!-- Opciones generadas dinámicamente con casillas -->
      </select>

      <!-- Panel 'Filtrado por' -->
      <div class="active-filters-bar" id="active-filters-container">
        <!-- Renderizado dinámico de filtros activos -->
      </div>
    </div>

    <div id="list-roster"></div>
  </div>

  <!-- TAB 2: TAG TEAMS -->
  <div id="tab-teams" class="tab-content">
    <form id="form-teams">
      <input type="text" id="team-name" placeholder="Nombre del Tag Team / Ficción" required>
      <label style="font-size:0.75rem; color:var(--text-dim);">SELECCIONA MIEMBROS DEL ROSTER:</label>
      <div class="checkbox-list" id="team-members-select">
        <!-- Generado dinámicamente -->
      </div>
      <button type="submit" class="btn-add">Crear Tag Team</button>
    </form>
    <div id="list-teams"></div>
  </div>

  <!-- TAB 3: CAMPEONES -->
  <div id="tab-titles" class="tab-content">
    <form id="form-titles">
      <input type="text" id="title-name" placeholder="Nombre del Título (ej. WWE Championship)" required>
      <input type="text" id="title-holder" placeholder="Campeón Actual" required>
      <button type="submit" class="btn-add">Añadir Campeón</button>
    </form>
    <div id="list-titles"></div>
  </div>

  <!-- TAB 4: SHOWS / MATCH CARDS -->
  <div id="tab-matches" class="tab-content">
    <form id="form-matches">
      <input type="text" id="match-show" placeholder="Show / PPV (ej. SummerSlam)" required>
      <input type="text" id="match-card" placeholder="Combate (ej. Cena vs. Orton)" required>
      <input type="text" id="match-winner" placeholder="Ganador / Resultado (dejar 'Pendiente' si no se ha jugado)">
      <button type="submit" class="btn-add">Guardar Combate</button>
    </form>
    <div id="list-matches"></div>
  </div>

  <!-- MODAL FICHA Y EDICIÓN DE LUCHADOR -->
  <div id="modal-wrestler" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title" id="modal-wrestler-title">Ficha de Luchador</span>
        <button class="modal-close" onclick="closeWrestlerModal()">✕</button>
      </div>

      <!-- Formulario de Edición -->
      <form id="form-edit-wrestler" style="margin-bottom:0;">
        <label style="font-size:0.75rem; color:var(--text-dim);">DATOS GENERALES</label>
        <input type="text" id="edit-name" placeholder="Nombre" required>
        <select id="edit-brand">
          <option value="RAW">RAW</option>
          <option value="SmackDown">SmackDown</option>
          <option value="NXT">NXT</option>
          <option value="EVOLVE">EVOLVE</option>
        </select>
        <select id="edit-alignment">
          <option value="Face">Face</option>
          <option value="Heel">Heel</option>
        </select>
        <select id="edit-gender">
          <option value="Men">Men</option>
          <option value="Women">Women</option>
        </select>
        <select id="edit-division">
          <option value="Main Eventer">Main Eventer</option>
          <option value="Midcarder">Midcarder</option>
          <option value="Tag Team">Tag Team</option>
          <option value="Jobber">Jobber</option>
        </select>
        <label style="font-size:0.75rem; color:var(--text-dim);">TAG TEAM / EQUIPO</label>
        <select id="edit-team">
          <option value="">-- Ninguno --</option>
        </select>
        <button type="submit" class="btn-add" style="background:#2e7d32;">Guardar Cambios</button>
      </form>

      <!-- Estadísticas de Combates -->
      <div>
        <label style="font-size:0.75rem; color:var(--text-dim); display:block; margin-bottom:6px;">RÉCORD GLOBAL</label>
        <div class="stats-summary">
          <div class="stat-card">
            <div class="stat-val" id="stat-wins" style="color:#4caf50;">0</div>
            <div class="stat-lbl">Victorias</div>
          </div>
          <div class="stat-card">
            <div class="stat-val" id="stat-losses" style="color:#f44336;">0</div>
            <div class="stat-lbl">Derrotas</div>
          </div>
          <div class="stat-card">
            <div class="stat-val" id="stat-draws" style="color:#ffeb3b;">0</div>
            <div class="stat-lbl">Emp/Pend</div>
          </div>
        </div>
      </div>

      <!-- Comparador Head to Head (H2H) -->
      <div class="h2h-section">
        <span class="h2h-header">⚔️ COMPARADOR HEAD-TO-HEAD (H2H)</span>
        <select id="h2h-opponent" onchange="renderH2H()">
          <option value="">-- Selecciona un rival --</option>
        </select>
        <div id="h2h-result" style="font-size:0.85rem; color:var(--text-dim); text-align:center;">
          Selecciona un rival para ver el historial cara a cara.
        </div>
      </div>

      <!-- Historial de Combates Completo -->
      <div>
        <label style="font-size:0.75rem; color:var(--text-dim); display:block; margin-bottom:6px;">HISTORIAL DE COMBATES</label>
        <div id="wrestler-history-list"></div>
      </div>
    </div>
  </div>

  <nav>
    <button class="active" onclick="switchTab('roster', this)">Roster</button>
    <button onclick="switchTab('teams', this)">Tag Teams</button>
    <button onclick="switchTab('titles', this)">Títulos</button>
    <button onclick="switchTab('matches', this)">Cartelera</button>
  </nav>

  <script>
    // Cargar datos guardados
    let store = JSON.parse(localStorage.getItem('universe_data')) || { roster: [], teams: [], titles: [], matches: [] };
    if(!store.teams) store.teams = [];

    // Estado de filtros activos
    let filters = {
      brand: 'ALL',
      alignment: 'ALL',
      gender: 'ALL',
      division: 'ALL'
    };

    let activeWrestlerId = null;

    function saveData() {
      localStorage.setItem('universe_data', JSON.stringify(store));
      render();
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      btn.classList.add('active');
    }

    function onFilterChange(select) {
      const [type, value] = select.value.split(':');
      filters[type] = value;
      render();
    }

    // Función para eliminar un filtro activo haciendo clic en su etiqueta
    function clearFilter(filterType) {
      filters[filterType] = 'ALL';
      render();
    }

    // Configuración estructural de opciones para los filtros
    const filterGroupsConfig = [
      {
        type: 'brand',
        label: 'Marca',
        options: [
          { val: 'ALL', text: 'Todas las marcas' },
          { val: 'RAW', text: 'RAW' },
          { val: 'SmackDown', text: 'SmackDown' },
          { val: 'NXT', text: 'NXT' },
          { val: 'EVOLVE', text: 'EVOLVE' }
        ]
      },
      {
        type: 'alignment',
        label: 'Alineación',
        options: [
          { val: 'ALL', text: 'Todas las alineaciones' },
          { val: 'Face', text: 'Face' },
          { val: 'Heel', text: 'Heel' }
        ]
      },
      {
        type: 'gender',
        label: 'Género',
        options: [
          { val: 'ALL', text: 'Todos los géneros' },
          { val: 'Men', text: 'Men' },
          { val: 'Women', text: 'Women' }
        ]
      },
      {
        type: 'division',
        label: 'División',
        options: [
          { val: 'ALL', text: 'Todas las divisiones' },
          { val: 'Main Eventer', text: 'Main Eventer' },
          { val: 'Midcarder', text: 'Midcarder' },
          { val: 'Tag Team', text: 'Tag Team' },
          { val: 'Jobber', text: 'Jobber' }
        ]
      }
    ];

    function renderFilterSelect() {
      const select = document.getElementById('filter-select-all');
      select.innerHTML = filterGroupsConfig.map(group => {
        const optionsHTML = group.options.map(opt => {
          const isActive = filters[group.type] === opt.val;
          const box = isActive ? '[☑]' : '[☐]';
          return `<option value="${group.type}:${opt.val}" ${isActive ? 'selected' : ''}>${box} ${group.label}: ${opt.text}</option>`;
        }).join('');
        return `<optgroup label="${group.label}">${optionsHTML}</optgroup>`;
      }).join('');
    }

    function renderActiveFiltersBar() {
      const container = document.getElementById('active-filters-container');
      const activeBadges = [];

      if (filters.brand !== 'ALL') activeBadges.push({ type: 'brand', label: `Marca: ${filters.brand}` });
      if (filters.alignment !== 'ALL') activeBadges.push({ type: 'alignment', label: `Alineación: ${filters.alignment}` });
      if (filters.gender !== 'ALL') activeBadges.push({ type: 'gender', label: `Género: ${filters.gender}` });
      if (filters.division !== 'ALL') activeBadges.push({ type: 'division', label: `División: ${filters.division}` });

      if (activeBadges.length === 0) {
        container.innerHTML = `<span class="active-filters-label">Filtrado por:</span> <span style="color: var(--text-dim); font-size: 0.75rem;">Ninguno (Mostrando todos)</span>`;
      } else {
        const badgesHTML = activeBadges.map(b => 
          `<span class="filter-badge" onclick="clearFilter('${b.type}')" title="Toca para quitar filtro">📌 ${b.label} <span class="close-icon">✕</span></span>`
        ).join('');
        container.innerHTML = `<span class="active-filters-label">Filtrado por:</span> ${badgesHTML}`;
      }
    }

    // Handlers para añadir items
    document.getElementById('form-roster').onsubmit = (e) => {
      e.preventDefault();
      store.roster.push({
        id: Date.now(),
        name: document.getElementById('roster-name').value.trim(),
        brand: document.getElementById('roster-brand').value,
        alignment: document.getElementById('roster-alignment').value,
        gender: document.getElementById('roster-gender').value || 'Men',
        division: document.getElementById('roster-division').value || 'Midcarder',
        teamId: null
      });
      e.target.reset();
      saveData();
    };

    document.getElementById('form-teams').onsubmit = (e) => {
      e.preventDefault();
      const teamName = document.getElementById('team-name').value.trim();
      const checkedBoxes = document.querySelectorAll('#team-members-select input[type="checkbox"]:checked');
      const memberIds = Array.from(checkedBoxes).map(cb => parseInt(cb.value));

      if (memberIds.length === 0) {
        alert("Por favor selecciona al menos un luchador para el equipo.");
        return;
      }

      const teamId = Date.now();
      store.teams.push({ id: teamId, name: teamName, members: memberIds });

      // Asignar teamId a cada luchador seleccionado
      store.roster.forEach(r => {
        if (memberIds.includes(r.id)) {
          r.teamId = teamId;
        }
      });

      e.target.reset();
      saveData();
    };

    document.getElementById('form-titles').onsubmit = (e) => {
      e.preventDefault();
      store.titles.push({
        id: Date.now(),
        title: document.getElementById('title-name').value.trim(),
        holder: document.getElementById('title-holder').value.trim()
      });
      e.target.reset();
      saveData();
    };

    document.getElementById('form-matches').onsubmit = (e) => {
      e.preventDefault();
      store.matches.push({
        id: Date.now(),
        show: document.getElementById('match-show').value.trim(),
        card: document.getElementById('match-card').value.trim(),
        winner: document.getElementById('match-winner').value.trim() || 'Pendiente'
      });
      e.target.reset();
      saveData();
    };

    function deleteItem(type, id, e) {
      if(e) e.stopPropagation();
      if(type === 'teams') {
        // Desvincular luchadores de este equipo
        store.roster.forEach(r => {
          if (r.teamId === id) r.teamId = null;
        });
      }
      store[type] = store[type].filter(item => item.id !== id);
      saveData();
    }

    // Modal y Edición de Luchador
    function openWrestlerModal(id) {
      activeWrestlerId = id;
      const wrestler = store.roster.find(r => r.id === id);
      if(!wrestler) return;

      document.getElementById('modal-wrestler-title').innerText = wrestler.name;
      document.getElementById('edit-name').value = wrestler.name;
      document.getElementById('edit-brand').value = wrestler.brand;
      document.getElementById('edit-alignment').value = wrestler.alignment;
      document.getElementById('edit-gender').value = wrestler.gender || 'Men';
      document.getElementById('edit-division').value = wrestler.division || 'Midcarder';

      // Cargar lista de Tag Teams en el modal
      const editTeamSelect = document.getElementById('edit-team');
      editTeamSelect.innerHTML = `<option value="">-- Ninguno --</option>` +
        store.teams.map(t => `<option value="${t.id}" ${wrestler.teamId === t.id ? 'selected' : ''}>${t.name}</option>`).join('');

      // Cargar Selección H2H
      const opponentSelect = document.getElementById('h2h-opponent');
      opponentSelect.innerHTML = `<option value="">-- Selecciona un rival --</option>` +
        store.roster
          .filter(r => r.id !== id)
          .sort((a,b) => a.name.localeCompare(b.name))
          .map(r => `<option value="${r.id}">${r.name}</option>`)
          .join('');

      document.getElementById('h2h-result').innerHTML = 'Selecciona un rival para ver el historial cara a cara.';

      updateWrestlerStats(wrestler);
      document.getElementById('modal-wrestler').classList.add('active');
    }

    function closeWrestlerModal() {
      document.getElementById('modal-wrestler').classList.remove('active');
      activeWrestlerId = null;
    }

    document.getElementById('form-edit-wrestler').onsubmit = (e) => {
      e.preventDefault();
      const wrestler = store.roster.find(r => r.id === activeWrestlerId);
      if(wrestler) {
        const oldTeamId = wrestler.teamId;
        const newTeamId = document.getElementById('edit-team').value ? parseInt(document.getElementById('edit-team').value) : null;

        wrestler.name = document.getElementById('edit-name').value.trim();
        wrestler.brand = document.getElementById('edit-brand').value;
        wrestler.alignment = document.getElementById('edit-alignment').value;
        wrestler.gender = document.getElementById('edit-gender').value;
        wrestler.division = document.getElementById('edit-division').value;
        wrestler.teamId = newTeamId;

        // Actualizar relaciones de equipo en store.teams
        if (oldTeamId !== newTeamId) {
          if (oldTeamId) {
            const oldTeam = store.teams.find(t => t.id === oldTeamId);
            if (oldTeam) oldTeam.members = oldTeam.members.filter(mId => mId !== wrestler.id);
          }
          if (newTeamId) {
            const newTeam = store.teams.find(t => t.id === newTeamId);
            if (newTeam && !newTeam.members.includes(wrestler.id)) newTeam.members.push(wrestler.id);
          }
        }

        saveData();
        closeWrestlerModal(); // Cierra automáticamente la ventana tras guardar los cambios
      }
    };

    function updateWrestlerStats(wrestler) {
      const name = wrestler.name.toLowerCase();
      const matches = store.matches.filter(m => m.card.toLowerCase().includes(name));

      let wins = 0, losses = 0, draws = 0;

      const historyHTML = matches.map(m => {
        const winner = m.winner.toLowerCase();
        let outcomeClass = 'draw';
        let outcomeLabel = 'Pendiente / Empate';

        if (winner.includes(name)) {
          wins++;
          outcomeClass = 'win';
          outcomeLabel = 'Victoria';
        } else if (winner !== 'pendiente' && winner !== '' && winner !== 'empate') {
          losses++;
          outcomeClass = 'loss';
          outcomeLabel = 'Derrota';
        } else {
          draws++;
        }

        return `
          <div class="match-item ${outcomeClass}">
            <strong>${m.show}:</strong> ${m.card}<br>
            <span style="color:var(--text-dim); font-size:0.75rem;">Resultado: ${m.winner} (${outcomeLabel})</span>
          </div>
        `;
      }).join('');

      document.getElementById('stat-wins').innerText = wins;
      document.getElementById('stat-losses').innerText = losses;
      document.getElementById('stat-draws').innerText = draws;

      document.getElementById('wrestler-history-list').innerHTML = matches.length > 0 
        ? historyHTML 
        : `<p style="font-size:0.8rem; color:var(--text-dim);">No se han registrado combates para este luchador.</p>`;
    }

    function renderH2H() {
      const wrestler = store.roster.find(r => r.id === activeWrestlerId);
      const opponentId = parseInt(document.getElementById('h2h-opponent').value);
      const opponent = store.roster.find(r => r.id === opponentId);

      if (!wrestler || !opponent) {
        document.getElementById('h2h-result').innerHTML = 'Selecciona un rival para ver el historial cara a cara.';
        return;
      }

      const wName = wrestler.name.toLowerCase();
      const oName = opponent.name.toLowerCase();

      const sharedMatches = store.matches.filter(m => {
        const card = m.card.toLowerCase();
        return card.includes(wName) && card.includes(oName);
      });

      let wWins = 0, oWins = 0, draws = 0;

      const matchesList = sharedMatches.map(m => {
        const winner = m.winner.toLowerCase();
        let resText = 'Empate / Sin Resultado';
        if (winner.includes(wName)) {
          wWins++;
          resText = `Ganó ${wrestler.name}`;
        } else if (winner.includes(oName)) {
          oWins++;
          resText = `Ganó ${opponent.name}`;
        } else {
          draws++;
        }
        return `<div style="font-size:0.75rem; border-bottom:1px dashed #444; padding:3px 0;">📌 ${m.show}: ${m.card} (<b>${resText}</b>)</div>`;
      }).join('');

      document.getElementById('h2h-result').innerHTML = `
        <div style="font-weight:bold; font-size:1rem; margin-bottom:5px; color:#fff;">
          ${wrestler.name} <span style="color:var(--accent);">${wWins} - ${oWins}</span> ${opponent.name}
        </div>
        <div style="font-size:0.75rem; color:var(--text-dim); margin-bottom:8px;">Empates / Pendientes: ${draws}</div>
        ${sharedMatches.length > 0 ? matchesList : '<div style="font-size:0.75rem;">Sin combates registrados entre ellos.</div>'}
      `;
    }

    function render() {
      // 0. Actualizar UI de Filtros
      renderFilterSelect();
      renderActiveFiltersBar();

      // 1. Filtrar Roster
      let sortedRoster = [...store.roster].sort((a, b) => a.name.localeCompare(b.name));

      if (filters.brand !== 'ALL') sortedRoster = sortedRoster.filter(r => r.brand === filters.brand);
      if (filters.alignment !== 'ALL') sortedRoster = sortedRoster.filter(r => r.alignment === filters.alignment);
      if (filters.gender !== 'ALL') sortedRoster = sortedRoster.filter(r => (r.gender || 'Men') === filters.gender);
      if (filters.division !== 'ALL') sortedRoster = sortedRoster.filter(r => (r.division || 'Midcarder') === filters.division);

      // Render Roster
      document.getElementById('list-roster').innerHTML = sortedRoster.length > 0 
        ? sortedRoster.map(r => {
            const team = store.teams.find(t => t.id === r.teamId);
            const teamTagHTML = team ? `<span class="tag tag-team">👥 ${team.name}</span>` : '';
            return `
              <div class="card" onclick="openWrestlerModal(${r.id})">
                <div class="card-info">
                  <span class="card-title">${r.name}</span>
                  <div class="tags-container">
                    <span class="tag tag-${r.brand.toLowerCase()}">${r.brand}</span>
                    <span class="tag tag-${r.alignment.toLowerCase()}">${r.alignment}</span>
                    <span class="tag tag-gender">${r.gender || 'Men'}</span>
                    <span class="tag tag-division">${r.division || 'Midcarder'}</span>
                    ${teamTagHTML}
                  </div>
                </div>
                <button class="btn-del" onclick="deleteItem('roster', ${r.id}, event)">✕</button>
              </div>
            `;
          }).join('')
        : `<p style="color: var(--text-dim); text-align: center; margin-top: 20px; font-size: 0.9rem;">No hay Superstars que cumplan estos filtros.</p>`;

      // 2. Render Selección de miembros en Formulario de Tag Teams
      document.getElementById('team-members-select').innerHTML = store.roster.length > 0
        ? store.roster.map(r => `
            <label class="checkbox-item">
              <input type="checkbox" value="${r.id}">
              <span>${r.name} (${r.brand})</span>
            </label>
          `).join('')
        : `<span style="font-size:0.8rem; color:var(--text-dim);">Añade primero luchadores al Roster.</span>`;

      // 3. Render Lista de Tag Teams
      document.getElementById('list-teams').innerHTML = store.teams.map(t => {
        const membersList = store.roster
          .filter(r => t.members && t.members.includes(r.id))
          .map(r => r.name)
          .join(' & ');

        return `
          <div class="card" style="cursor:default;">
            <div class="card-info">
              <span class="card-title">👥 ${t.name}</span>
              <span class="card-sub">Miembros: ${membersList || 'Sin miembros asignados'}</span>
            </div>
            <button class="btn-del" onclick="deleteItem('teams', ${t.id}, event)">✕</button>
          </div>
        `;
      }).join('');

      // Render Titles
      document.getElementById('list-titles').innerHTML = store.titles.map(t => `
        <div class="card" style="cursor:default;">
          <div class="card-info">
            <span class="card-title">${t.title}</span>
            <span class="card-sub">🏆 ${t.holder}</span>
          </div>
          <button class="btn-del" onclick="deleteItem('titles', ${t.id}, event)">✕</button>
        </div>
      `).join('');

      // Render Matches
      document.getElementById('list-matches').innerHTML = store.matches.map(m => `
        <div class="card" style="cursor:default;">
          <div class="card-info">
            <span class="card-title">${m.card}</span>
            <span class="card-sub">📌 ${m.show} | 👑 Ganador: ${m.winner}</span>
          </div>
          <button class="btn-del" onclick="deleteItem('matches', ${m.id}, event)">✕</button>
        </div>
      `).join('');
    }

    render();
  </script>
</body>
</html>
